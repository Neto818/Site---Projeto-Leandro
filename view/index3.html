<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Área de pedido</title>
  </head>

  <body>

    <h1><b>Faça seu cadastro aqui</b></h1>

    <form autocomplete="on">

      <fieldset>

        <legend>Preencha seus dados</legend>

        <label for="Nome">Nome:</label>
        <input type="text" id="Nome"><br>

        <label for="Sobrenome">Sobrenome:</label>
        <input type="text" id="Sobrenome"><br>

        <label for="Idade">Idade:</label>
        <input type="number" id="Idade"><br>

        <label for="Email">Email:</label>
        <input type="text" id="Email"><br>

        <label for="Telefone">Telefone:</label>
        <input type="text" id="Telefone"><br>

        <label for="Senha">Senha:</label>
        <input type="password" id="Senha"><br>

        <label for="Endereco">Endereço:</label>
        <input type="text" id="Endereco"><br>

        <label for="Sexo">Sexo:</label>

        <select id="Sexo">
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Prefiro não dizer">Prefiro não dizer</option>
        </select>

        <br><br>

        <a href="index2.html">
          <button type="button">Realizar Cadastro</button>
        </a>

      </fieldset>

    </form>

  </body>
</html>
